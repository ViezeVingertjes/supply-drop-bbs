[package]
name            = "meshcore-kiss"
description     = "A pure-Rust MeshCore node stack speaking the KISS Modem serial protocol"
version.workspace      = true
edition.workspace      = true
authors.workspace      = true
repository.workspace   = true
rust-version.workspace = true
license-file    = "../../LICENSE"
publish         = false   # standalone, but not published to crates.io yet

[dependencies]
meshcore-companion.workspace = true
serde.workspace              = true
serde_json.workspace         = true
thiserror.workspace          = true
tokio = { workspace = true, features = ["io-util"] }
tokio-serial.workspace       = true
tracing.workspace            = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "test-util"] }

[features]
hardware-tests = []                   # needs a real device on $SDBBS_KISS_PORT

[lints]
workspace = true
